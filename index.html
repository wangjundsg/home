<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#E8734A">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="小花园">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="assets/icons/icon-192.png">
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
  <title>我们的花园</title>
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/screens.css">
</head>
<body>
  <!-- Header -->
  <header class="app-header">
    <button class="app-header-left" aria-label="返回" style="visibility:hidden"></button>
    <span class="app-header-title">急救贴士</span>
    <button class="app-header-right" aria-label="设置">⚙️</button>
  </header>

  <!-- App Container -->
  <main id="app">
    <!-- Screen: Emergency -->
    <section class="screen active" id="screen-home"></section>

    <!-- Screen: Daily -->
    <section class="screen" id="screen-daily"></section>

    <!-- Screen: Commitments -->
    <section class="screen" id="screen-commitments"></section>

    <!-- Screen: Compensation -->
    <section class="screen" id="screen-compensation"></section>

    <!-- Screen: Interact -->
    <section class="screen" id="screen-interact"></section>
  </main>

  <!-- Bottom Navigation -->
  <nav class="bottom-nav">
    <button class="nav-item active" data-screen="home">
      <span class="nav-icon">🩺</span>
      <span>急救</span>
    </button>
    <button class="nav-item" data-screen="daily">
      <span class="nav-icon">📋</span>
      <span>日常</span>
    </button>
    <button class="nav-item" data-screen="commitments">
      <span class="nav-icon">🤝</span>
      <span>承诺</span>
    </button>
    <button class="nav-item" data-screen="compensation">
      <span class="nav-icon">🏪</span>
      <span>补偿</span>
    </button>
    <button class="nav-item" data-screen="interact">
      <span class="nav-icon">🎮</span>
      <span>互动</span>
    </button>
  </nav>

  <!-- Screen Scripts -->
  <script src="js/storage.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/router.js"></script>
  <script src="js/screens/home.js"></script>
  <script src="js/screens/daily.js"></script>
  <script src="js/screens/commitments.js"></script>
  <script src="js/screens/compensation.js"></script>
  <script src="js/screens/interact.js"></script>
  <script src="js/screens/meeting.js"></script>
  <script src="js/screens/growth.js"></script>
  <script src="js/screens/phrases.js"></script>
  <script src="js/screens/settings.js"></script>
  <!-- App Entry -->
  <script src="js/app.js"></script>
</body>
</html>
