<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Heartbeat Game Tests</title>
</head>
<body>
  <pre id="results"></pre>
  <script src="../js/heartbeat-content.js"></script>
  <script src="../js/heartbeat-game.js"></script>
  <script>
    var results = [];
    function test(name, fn) {
      try {
        fn();
        results.push('PASS ' + name);
      } catch (error) {
        results.push('FAIL ' + name + ': ' + error.message);
      }
    }
    function assert(condition, message) {
      if (!condition) throw new Error(message);
    }

    test('test_heartbeat_content_exposes_four_levels', function() {
      assert(window.R.HeartbeatContent.levelOrder.length === 4, 'expected four levels');
      assert(window.R.HeartbeatContent.levels.beginner.label === '初级', 'expected beginner label');
      assert(window.R.HeartbeatContent.cards.final.length > 0, 'expected final cards');
    });

    test('test_heartbeat_engine_creates_local_two_player_session', function() {
      var session = window.R.HeartbeatGame.createSession();
      assert(session.currentLevel === 'beginner', 'expected beginner default level');
      assert(session.currentPlayer === 'A', 'expected A starts');
      assert(session.players.A.position === 0, 'expected A starts at 0');
      assert(session.players.B.position === 0, 'expected B starts at 0');
      assert(session.board.length === 40, 'expected initial board segment');
    });

    test('test_heartbeat_board_segment_has_stable_cell_proportions', function() {
      var segment = window.R.HeartbeatGame.generateSegment(0);
      var counts = segment.reduce(function(acc, cell) {
        acc[cell.type] = (acc[cell.type] || 0) + 1;
        return acc;
      }, {});
      assert(counts.normal === 16, 'expected 16 normal cells');
      assert(counts.double === 5, 'expected 5 double cells');
      assert(counts.reroll === 1, 'expected 1 reroll cell');
      assert(segment[0].index === 0, 'expected first index 0');
      assert(segment[39].index === 39, 'expected last index 39');
    });

    test('test_heartbeat_roll_moves_current_player_and_toggles_turn', function() {
      var session = window.R.HeartbeatGame.createSession();
      var result = window.R.HeartbeatGame.roll(session, 3);
      assert(result.roll === 3, 'expected roll value 3');
      assert(result.player === 'A', 'expected A rolled');
      assert(result.session.players.A.position === 3, 'expected A moved to 3');
      assert(result.session.currentPlayer === 'B', 'expected turn toggled to B');
      assert(result.card || result.effect, 'expected a card or effect');
    });

    test('test_heartbeat_set_level_changes_main_level_without_changing_positions', function() {
      var session = window.R.HeartbeatGame.createSession();
      session.players.A.position = 6;
      var changed = window.R.HeartbeatGame.setLevel(session, 'advanced');
      assert(changed.currentLevel === 'advanced', 'expected advanced level');
      assert(changed.players.A.position === 6, 'expected position preserved');
    });

    test('test_heartbeat_engine_and_content_are_exposed_on_window_r', function() {
      assert(typeof window.R.HeartbeatContent === 'object', 'expected HeartbeatContent object');
      assert(typeof window.R.HeartbeatGame.roll === 'function', 'expected HeartbeatGame.roll function');
    });

    document.getElementById('results').textContent = results.join('\n');
    window.__HEARTBEAT_TEST_RESULTS__ = results;
  </script>
</body>
</html>
